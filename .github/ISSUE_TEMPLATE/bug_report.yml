name: Bug report
description: A tool returned something wrong, failed, or the server would not start.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste your `FS_ACCESS_TOKEN`, client id or password. Check any log or `.env` excerpt for them before submitting.
        A security problem goes to [private vulnerability reporting](https://github.com/ianderso/familysearch-mcp/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what came back, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: tool-call
    attributes:
      label: Tool call
      description: The tool, its arguments, and the result it returned. An ark, place id or collection id makes the problem reproducible.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit if you run from a clone (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: FamilySearch environment
      options:
        - production
        - integration (sandbox)
        - no token configured
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - Other (say which above)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The server logs to stderr, which your MCP client usually keeps. Paste the lines around the failure.
      render: text
